name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build native targets (CMake, clang)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-macos -DMLX_ONNX_BUILD_PYTHON_BINDINGS=ON -DMLX_ONNX_INSTALL_CPP_ARTIFACTS=OFF
          cmake --build build-macos --parallel

      - name: Install project
        env:
          CC: clang
          CXX: clang++
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m invoke test

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libopenblas-dev liblapack-dev liblapacke-dev

      - name: Build wheel
        env:
          CC: clang
          CXX: clang++
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
