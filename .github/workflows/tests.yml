name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  test-macos:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel
        env:
          CC: clang
          CXX: clang++
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install built wheel for tests
        run: |
          WHEEL_PATH="$(ls dist/*.whl | head -n 1)"
          python -m pip install "mlx-onnx[test] @ file://${PWD}/${WHEEL_PATH}"

      - name: Run macOS test suite
        run: python -m invoke test

  test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libopenblas-dev liblapack-dev liblapacke-dev

      - name: Build wheel
        env:
          CC: clang
          CXX: clang++
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install built wheel for tests
        run: |
          WHEEL_PATH="$(ls dist/*.whl | head -n 1)"
          python -m pip install "mlx-onnx[test] @ file://${PWD}/${WHEEL_PATH}"

      - name: Run Linux test suite
        run: |
          python -m pytest python/tests -q --ignore=python/tests/test_examples.py
          python -c "import sys, pytest, mlx.core as mx; mx.set_default_device(mx.cpu); sys.exit(pytest.main(['python/tests/test_examples.py', '-q']))"
